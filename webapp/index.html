<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angel Arena</title>
    <link rel="stylesheet" href="/style.css?v=9">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <h1>ANGEL ARENA</h1>
        </div>

        <!-- Mode Tabs -->
        <div class="mode-tabs">
            <button class="mode-tab active" id="tabInpaint" data-mode="inpaint"><span
                    class="tab-emoji">🎨</span>Inpaint</button>
            <button class="mode-tab" id="tabVideo" data-mode="video"><span class="tab-emoji">🎬</span>Video</button>
            <button class="mode-tab" id="tabImage" data-mode="image"><span class="tab-emoji">🖼️</span>Edit</button>
            <button class="mode-tab" id="tabDark" data-mode="dark"><span class="tab-emoji">🖤</span>Dark</button>
        </div>

        <!-- ============================================ -->
        <!-- SHARED: Upload Photo -->
        <!-- ============================================ -->
        <div class="section" id="uploadSection">
            <div class="section-title">📷 Photo</div>
            <div class="upload-area" id="uploadArea">
                <div class="upload-placeholder" id="uploadPlaceholder">
                    <span class="upload-icon">📁</span>
                    <span>Tap to upload or paste (Ctrl+V)</span>
                </div>
                <input type="file" id="fileInput" accept="image/*" hidden>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- INPAINT MODE: Canvas + Mask -->
        <!-- ============================================ -->
        <div class="section inpaint-only" id="canvasSection" style="display:none;">
            <div class="section-title">🖌️ Mask</div>
            <div class="canvas-container" id="canvasContainer">
                <canvas id="mainCanvas"></canvas>
                <canvas id="maskCanvas"></canvas>
            </div>
            <div class="tools">
                <button class="tool-btn active" id="brushBtn" data-tool="brush">🖌️ Brush</button>
                <button class="tool-btn" id="eraserBtn" data-tool="eraser">⬜ Eraser</button>
                <button class="tool-btn danger" id="clearBtn">🗑️ Clear</button>
                <div class="brush-size-control">
                    <label>Size: <span id="brushSizeLabel">20</span>px</label>
                    <input type="range" id="brushSize" min="5" max="100" value="20">
                </div>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- SHARED: Prompt -->
        <!-- ============================================ -->
        <div class="section" id="promptSection" style="display:none;">
            <div class="section-title">✏️ Prompt</div>
            <div class="preset-row" id="presetRow">
                <!-- Populated by JS based on currentMode -->
            </div>
            <textarea id="promptInput" placeholder="Describe what to generate..." rows="3"></textarea>

            <div class="section-title sub">❌ Negative</div>
            <textarea id="negativeInput" rows="2"></textarea>
        </div>

        <!-- ============================================ -->
        <!-- INPAINT MODE: Settings -->
        <!-- ============================================ -->
        <div class="section settings-row inpaint-only" id="settingsSection" style="display:none;">
            <div class="setting">
                <label>CFG: <span id="cfgLabel">3.5</span></label>
                <input type="range" id="cfgSlider" min="1" max="10" step="0.5" value="3.5">
            </div>
            <div class="setting">
                <label>Steps: <span id="stepsLabel">25</span></label>
                <input type="range" id="stepsSlider" min="10" max="50" step="1" value="25">
            </div>
        </div>

        <!-- ============================================ -->
        <!-- IMAGE MODE: Edit Settings -->
        <!-- ============================================ -->
        <div class="section settings-row image-only" id="imageSettingsSection" style="display:none;">
            <div class="setting">
                <label>Denoise: <span id="denoiseLabel">1.00</span></label>
                <input type="range" id="denoiseSlider" min="0.1" max="1.0" step="0.05" value="1.0">
            </div>
            <div class="setting">
                <label>Steps: <span id="editStepsLabel">8</span></label>
                <input type="range" id="editStepsSlider" min="2" max="50" step="1" value="8">
            </div>
            <input type="hidden" id="loraNameInput" value="flux20klein2020NSFW.1M27.safetensors">
            <input type="hidden" id="loraStrengthSlider" value="0.7">
        </div>

        <!-- ============================================ -->
        <!-- DARK MODE: Dark Beast Settings -->
        <!-- ============================================ -->
        <div class="section settings-row dark-only" id="darkSettingsSection" style="display:none;">
            <div class="setting">
                <label>Denoise: <span id="darkDenoiseLabel">0.85</span></label>
                <input type="range" id="darkDenoiseSlider" min="0.1" max="1.0" step="0.05" value="0.85">
            </div>
            <div class="setting">
                <label>Steps: <span id="darkStepsLabel">5</span></label>
                <input type="range" id="darkStepsSlider" min="2" max="20" step="1" value="5">
            </div>
        </div>
        <div class="section dark-only" id="darkModeSection" style="display:none;">
            <div class="section-title">🎨 Mode</div>
            <div class="quality-toggle">
                <button class="quality-btn active" id="darkModeEdit" data-darkmode="edit">✏️ Edit</button>
                <button class="quality-btn" id="darkModeGenerate" data-darkmode="generate">🔥 Generate</button>
            </div>
        </div>
        <div class="section dark-only" id="darkQualitySection" style="display:none;">
            <div class="section-title">⚡ Quality</div>
            <div class="quality-toggle">
                <button class="quality-btn active" id="qualityFast" data-quality="fast">⚡ Fast</button>
                <button class="quality-btn" id="qualityDetailed" data-quality="detailed">✨ Detailed</button>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- VIDEO MODE: Audio Settings -->
        <!-- ============================================ -->
        <div class="section video-only" id="audioSection" style="display:none;">
            <div class="audio-toggle-row">
                <div class="section-title">🔊 Audio</div>
                <label class="toggle-switch">
                    <input type="checkbox" id="audioToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="audio-settings" id="audioSettings" style="display:none;">
                <textarea id="audioPromptInput" placeholder="Audio prompt (soft moaning, breathing, water dripping...)"
                    rows="2"></textarea>
                <div class="section-title sub">❌ Audio Negative</div>
                <textarea id="audioNegativeInput" rows="1">music, speech, talking, noise, static</textarea>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- VIDEO MODE: Video Settings -->
        <!-- ============================================ -->
        <div class="section video-only" id="videoSettingsSection" style="display:none;">
            <div class="section-title">⚙️ Video Settings</div>
            <div class="video-settings-grid">
                <div class="setting">
                    <label>Frames: <span id="framesLabel">33</span></label>
                    <input type="range" id="framesSlider" min="17" max="129" step="4" value="33">
                </div>
                <div class="setting">
                    <label>FPS: <span id="fpsLabel">16</span></label>
                    <select id="fpsSelect">
                        <option value="16" selected>16</option>
                        <option value="24">24</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Resolution:</label>
                    <select id="resolutionSelect">
                        <option value="auto" selected>Auto (from photo)</option>
                        <option value="480x832">480×832</option>
                        <option value="720x1280">720×1280</option>
                    </select>
                </div>
                <div class="setting" style="grid-column: 1 / -1;">
                    <label>Action:</label>
                    <select id="actionSelect">
                        <option value="none" selected>None</option>
                        <option value="blowjob">🍆 POV Blowjob</option>
                        <option value="deepthroat">🫦 Deepthroat</option>
                        <option value="doggy">🐕 Front Doggy</option>
                        <option value="missionary">🛏️ POV Missionary</option>
                        <option value="side_sex">🔄 Side Sex</option>
                        <option value="cowgirl">🤠 Reverse Cowgirl</option>
                        <option value="fingering">👆 Fingering</option>
                        <option value="nipple">💋 Nipple Stroke</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Shift: <span id="shiftValue">5</span></label>
                    <input type="range" id="shiftSlider" min="1" max="10" step="0.5" value="5"
                        oninput="document.getElementById('shiftValue').textContent=this.value">
                </div>
                <div class="setting">
                    <label>CFG High: <span id="cfgHighValue">5</span></label>
                    <input type="range" id="cfgHighSlider" min="1" max="10" step="0.5" value="5"
                        oninput="document.getElementById('cfgHighValue').textContent=this.value">
                </div>
                <div class="setting">
                    <label>CFG Low: <span id="cfgLowValue">1</span></label>
                    <input type="range" id="cfgLowSlider" min="1" max="5" step="0.5" value="1"
                        oninput="document.getElementById('cfgLowValue').textContent=this.value">
                </div>
                <div class="setting">
                    <label>LoRA: <span id="loraStrValue">1.3</span></label>
                    <input type="range" id="loraStrSlider" min="0.5" max="2.0" step="0.1" value="1.3"
                        oninput="document.getElementById('loraStrValue').textContent=this.value">
                </div>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- Batch Count + Generate Button -->
        <!-- ============================================ -->
        <div class="section" id="generateSection" style="display:none;">
            <div class="batch-row">
                <label class="batch-label">Count:</label>
                <div class="batch-selector" id="batchSelector">
                    <button class="batch-btn active" data-count="1">1</button>
                    <button class="batch-btn" data-count="2">2</button>
                    <button class="batch-btn" data-count="3">3</button>
                    <button class="batch-btn" data-count="4">4</button>
                </div>
            </div>
            <button class="generate-btn" id="generateBtn">
                <span class="btn-text">🚀 Generate</span>
                <span class="btn-loader" style="display:none;">
                    <span class="spinner"></span> Generating...
                </span>
            </button>
            <div class="progress-info" id="progressInfo" style="display:none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="progressText">Starting...</span>
                <button id="cancelVideoBtn" onclick="cancelVideoGeneration()"
                    style="display:none; margin-top: 8px; padding: 8px 20px; background: #e74c3c; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; width: 100%;">🚫
                    Cancel Generation</button>
            </div>
            <div class="model-loading-info" id="modelLoadingInfo" style="display:none;">
                <span>🟠 Loading model...</span>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- Result (Image or Video) -->
        <!-- ============================================ -->
        <div class="section" id="resultSection" style="display:none;">
            <div class="section-title">🖼️ Result</div>
            <div class="result-container">
                <img id="resultImage" src="" alt="Result" style="display:none;">
                <video id="resultVideo" controls loop style="display:none;"></video>
            </div>
            <div class="result-actions">
                <button class="action-btn" id="downloadBtn">💾 Save</button>
                <button class="action-btn" id="copyBtn">📋 Copy</button>
                <button class="action-btn secondary" id="retryBtn">🔄 Retry</button>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- Gallery (Generation History) -->
        <!-- ============================================ -->
        <div class="section" id="gallerySection" style="display:none;">
            <div class="section-title">📂 Gallery</div>
            <div class="gallery-strip" id="galleryStrip">
                <!-- Thumbnails injected by JS -->
            </div>
        </div>

        <!-- Gallery Lightbox -->
        <div class="gallery-lightbox" id="galleryLightbox" style="display:none;">
            <div class="lightbox-overlay" id="lightboxOverlay"></div>
            <div class="lightbox-content">
                <img id="lightboxImage" src="" alt="Preview">
                <div class="lightbox-actions">
                    <button class="action-btn" id="lightboxDownload">💾 Save</button>
                    <button class="action-btn" id="lightboxCopy">📋 Copy</button>
                    <button class="action-btn danger" id="lightboxDelete">🗑️ Delete</button>
                    <button class="action-btn secondary" id="lightboxClose">✕ Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js?v=9"></script>
</body>

</html>
